<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

</head>

<body>

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <p>
        Don't have an account?
        <a href="register.html">
            Register
        </a>
    </p>


<script>

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        try {

            const response =
                await fetch(
                    "/api/users/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    }
                );


            const data =
                await response.json();


            document.getElementById(
                "message"
            ).innerText =
                data.message;


            if (response.ok) {

                // Save JWT
                localStorage.setItem(
                    "token",
                    data.token
                );


                // Save user
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );


                setTimeout(function() {

                    window.location.href =
                        "dashboard.html";

                }, 500);

            }

        } catch (error) {

            console.error(error);

            document.getElementById(
                "message"
            ).innerText =
                "Cannot connect to server.";

        }

    }
);

</script>

</body>

</html>
